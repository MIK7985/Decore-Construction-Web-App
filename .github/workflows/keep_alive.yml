name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes — prevents Render free tier sleep
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} — App is awake" \
            https://your-app-name.onrender.com/
