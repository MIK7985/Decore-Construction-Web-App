{% load static %}<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Decore</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Decore theme -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Loading overlay -->
    <div id="decoreLoadingOverlay" class="decore-loading-overlay">
        <div class="spinner-border text-decore-primary" style="width:3rem;height:3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="decore-auth-wrapper">
        <div class="decore-auth-card">
            <div class="text-center mb-4">
                <img src="{% static 'images/logo.png' %}?v=2" class="mb-3" style="width: 72px; height: 72px; object-fit: contain; border-radius: 12px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.45);">
                <h3 class="fw-bold mb-1">Welcome Back</h3>
                <p class="text-white-50 small mb-0">Sign in to your Decore operational account</p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger py-2 small border-0 bg-danger text-white mb-3" style="--bs-alert-bg: rgba(239, 68, 68, 0.2);">
                    <i class="bi bi-exclamation-circle me-1"></i>Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="post" action="{% url 'accounts:login' %}" onsubmit="document.getElementById('decoreLoadingOverlay').classList.add('active');">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">
                    <label for="id_username" class="form-label text-white-50 small fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person text-white-50"></i></span>
                        <input type="text" class="form-control" id="id_username" name="username" placeholder="Enter your username" required autocomplete="username">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label text-white-50 small fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock text-white-50"></i></span>
                        <input type="password" class="form-control" id="id_password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>



                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-white-50 small" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="small text-white-50 text-decoration-underline" onclick="alert('Demo Mode: Please use your configured credentials.');">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-decore-primary w-100 py-2.5 fw-bold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
